name: Keep Supabase Active

on:
  # Run every 6 hours to prevent service from pausing
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: GET Request - Fetch tributes
        run: |
          curl -X GET \
            "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/rest/v1/tributes?limit=1&order=id.desc" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -w "\nGET Response Status: %{http_code}\n"
      
      - name: PUT Request - Update last accessed timestamp
        run: |
          CURRENT_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          curl -X PUT \
            "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/rest/v1/tributes?id=eq.-1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"updated_at":"'"$CURRENT_TIME"'"}' \
            -w "\nPUT Response Status: %{http_code}\n" || true
      
      - name: Log Success
        if: success()
        run: echo "✅ Supabase keep-alive completed at $(date)"
      
      - name: Log Failure
        if: failure()
        run: echo "❌ Supabase keep-alive failed at $(date)"
